<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harness: block preview</title>
  <style>
    body { margin: 0; background: #12151c; color: #eef1f7; font: 13px system-ui, sans-serif; }
    #view { display: grid; grid-template-columns: repeat(4, 220px); gap: 10px; padding: 10px; width: max-content; }
    .cell { background: #181c25; border: 1px solid #2a3140; border-radius: 8px; }
    .cell .box { width: 220px; height: 200px; }
    .cell p { margin: 4px 8px 8px; color: #b4bccb; }
  </style>
</head>
<body>
  <div id="view"></div>
  <script type="module" src="./block.ts"></script>
</body>
</html>
