<!doctype html>
<html lang="en" class="no-js" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--app-head-->
    <meta name="theme-color" content="#0d0f14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Texture Pack Maker" />
    <meta name="apple-mobile-web-app-title" content="Pack Maker" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/texel-regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var d = document.documentElement;
        d.className = d.className.replace('no-js', 'js');
        try {
          var t = localStorage.getItem('to-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          d.setAttribute('data-theme', t);
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef1f6');
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #0d0f14; }
      html[data-theme='light'] { background: #eef1f6; }
    </style>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
